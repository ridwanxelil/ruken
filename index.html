<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Derslerim</title>
  <style>
    :root {
      --bg: #fff8ec;
      --panel: #ffffff;
      --ink: #2b2d42;
      --muted: #8d8fa3;
      --primary: #ff7a59;
      --primary-dark: #e65f3d;
      --accent: #4cc9f0;
      --line: #f0e4d0;
      --sidebar-w: 300px;
      --topbar-h: 56px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    .app { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

    /* ===== SOL MENÜ ===== */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--panel);
      border-right: 2px solid var(--line);
      display: flex;
      flex-direction: column;
      z-index: 30;
      transition: transform .3s ease;
    }
    .brand {
      padding: 20px 18px 14px;
      background: linear-gradient(135deg, var(--primary), #ffb347);
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 46px; height: 46px;
      background: rgba(255,255,255,.25);
      border-radius: 14px;
      display: grid; place-items: center;
      font-size: 26px;
    }
    .brand h1 { font-size: 20px; line-height: 1.1; }
    .brand p { font-size: 13px; opacity: .9; margin-top: 2px; }

    .search-wrap { padding: 14px 14px 6px; }
    .search {
      width: 100%;
      padding: 11px 14px;
      border: 2px solid var(--line);
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      background: #fffdf8;
      color: var(--ink);
    }
    .search:focus { border-color: var(--accent); }

    .pick-btn {
      display: none;
      width: 100%;
      margin-top: 8px;
      padding: 11px 14px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .pick-btn.show { display: block; }

    .count {
      padding: 6px 18px 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .menu {
      list-style: none;
      flex: 1;
      overflow-y: auto;
      padding: 4px 10px 16px;
      -webkit-overflow-scrolling: touch;
    }
    .menu li { margin-bottom: 6px; }
    .menu a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 12px;
      text-decoration: none;
      color: var(--ink);
      font-size: 15px;
      font-weight: 600;
      border: 2px solid transparent;
      transition: background .15s, transform .15s;
    }
    .menu a:hover { background: #fff1dc; transform: translateX(3px); }
    .menu a.active { background: #ffe9e2; border-color: var(--primary); color: var(--primary-dark); }
    .menu .dot {
      width: 36px; height: 36px;
      flex-shrink: 0;
      border-radius: 10px;
      display: grid; place-items: center;
      font-size: 18px;
      color: #fff;
    }
    .menu .label {
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .empty {
      display: none;
      text-align: center;
      padding: 30px 18px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .empty.show { display: block; }

    /* ===== ANA ALAN ===== */
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      height: var(--topbar-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      background: var(--panel);
      border-bottom: 2px solid var(--line);
    }
    .burger {
      display: none;
      width: 42px; height: 42px;
      border: none;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }
    .current-title {
      flex: 1;
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .open-new {
      display: none;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary-dark);
      background: #ffe9e2;
      padding: 8px 12px;
      border-radius: 10px;
      white-space: nowrap;
    }
    .open-new.show { display: inline-block; }

    .viewer { position: relative; flex: 1; background: var(--bg); }
    .viewer iframe {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: none;
      background: #fff;
      display: none;
    }
    .viewer iframe.show { display: block; }

    .welcome {
      position: absolute; inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .welcome.hide { display: none; }
    .welcome .big { font-size: 72px; margin-bottom: 10px; }
    .welcome h2 { font-size: 26px; margin-bottom: 8px; }
    .welcome p { color: var(--muted); font-size: 16px; max-width: 360px; }

    .overlay { display: none; position: fixed; inset: 0; background: rgba(43,45,66,.45); z-index: 20; }

    /* ===== MOBİL ===== */
    @media (max-width: 800px) {
      .sidebar {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        width: min(86vw, 330px);
        transform: translateX(-100%);
        box-shadow: 6px 0 24px rgba(0,0,0,.2);
        padding-bottom: env(safe-area-inset-bottom);
      }
      .sidebar.open { transform: translateX(0); }
      .overlay.show { display: block; }
      .burger { display: grid; place-items: center; }
      .welcome h2 { font-size: 22px; }
      .welcome .big { font-size: 60px; }
    }
  </style>
</head>
<body>
  <div class="app">

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-icon">📚</div>
        <div>
          <h1>Derslerim</h1>
          <p>5. Sınıf · v3</p>
        </div>
      </div>

      <div class="search-wrap">
        <input class="search" id="search" type="search" placeholder="🔍 Ders ara..." autocomplete="off">
        <button class="pick-btn" id="pickBtn" type="button">📂 Klasörü seç</button>
        <input type="file" id="folderInput" webkitdirectory multiple hidden>
      </div>

      <div class="count" id="count">Dosyalar aranıyor...</div>
      <ul class="menu" id="menu"></ul>
      <div class="empty" id="empty"></div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main class="main">
      <header class="topbar">
        <button class="burger" id="burger" aria-label="Menüyü aç">☰</button>
        <div class="current-title" id="currentTitle">Bir ders seç</div>
        <a class="open-new" id="openNew" href="#" target="_blank" rel="noopener">Yeni sekmede aç ↗</a>
      </header>

      <section class="viewer">
        <div class="welcome" id="welcome">
          <div class="big">👋</div>
          <h2>Hoş geldin!</h2>
          <p>Soldaki menüden bir ders seç, burada açılsın.</p>
        </div>
        <iframe id="frame" title="Ders içeriği"></iframe>
      </section>
    </main>

  </div>

<script>
(function () {
  "use strict";

  /* ============ AYARLAR ============ */
  // GitHub Pages'te (kullanici.github.io/depo/) hiçbir ayar gerekmez, otomatik bulunur.
  // Özel alan adı kullanıyorsanız: const GITHUB = { owner: "kullanici", repo: "depo", path: "" };
  const GITHUB = null;

  // İsterseniz listeyi elle yazın (doluysa otomatik arama yapılmaz):
  // const DOSYALAR = [ { dosya: "konu-1.html", baslik: "Konu 1" } ];
  // Dosya adı, GitHub'a yüklediğiniz adla BİREBİR aynı olmalıdır (uzantı dahil).
  // Yeni ders eklerken buraya bir satır ekleyin. Adı bulunamayan satırlar menüde görünmez.
  const DOSYALAR = [
    { dosya: "5-sinif-1-donem-1-ortak-yazili-rehberi.html", baslik: "5. Sınıf 1. Dönem 1. Ortak Yazılı Rehberi" },
    { dosya: "gokyuzundeki-kosularimiz.html",               baslik: "Gökyüzündeki Komşularımız" },
    { dosya: "Robotik Kodlama Dersi – Çalışma Kağıdı.html", baslik: "Robotik Kodlama Dersi – Çalışma Kağıdı" },
    { dosya: "Programim.html",                              baslik: "MyLife" },
  ];

  const ICONS  = ["📘", "🔢", "🔬", "🌍", "🎨", "🎵", "🧩", "✏️", "🚀", "🌱"];
  const COLORS = ["#4cc9f0", "#ff7a59", "#7bd389", "#b388ff", "#ffb347", "#f06292"];
  const KAYIT  = "derslerim_liste_v3";

  /* ============ ELEMANLAR ============ */
  const $ = (id) => document.getElementById(id);
  const menu = $("menu"), frame = $("frame"), welcome = $("welcome");
  const sidebar = $("sidebar"), overlay = $("overlay"), burger = $("burger");
  const currentTitle = $("currentTitle"), openNew = $("openNew");
  const countEl = $("count"), emptyEl = $("empty"), searchEl = $("search"), pickBtn = $("pickBtn");

  // Herhangi bir hata olursa sessiz kalmasın, ekranda görünsün
  window.addEventListener("error", (e) => { countEl.textContent = "Hata: " + e.message; });
  window.addEventListener("unhandledrejection", (e) => {
    countEl.textContent = "Hata: " + ((e.reason && e.reason.message) || e.reason);
  });

  /* ============ DURUM ============ */
  let tumDosyalar = [];
  let aktifDosya = null;
  let araniyor = true;
  const hatalar = [];

  const currentFile = (function () {
    try { return (decodeURIComponent(location.pathname.split("/").pop()) || "index.html").toLowerCase(); }
    catch (e) { return "index.html"; }
  })();

  /* ============ YARDIMCILAR ============ */
  function guzelAd(dosya) {
    return dosya.replace(/\.html?$/i, "").replace(/[-_]+/g, " ").replace(/\s+/g, " ").trim();
  }
  function haric(ad) {
    const k = ad.toLowerCase();
    return k === "index.html" || k === "index.htm" || k === "404.html" || k === currentFile;
  }
  function sirala(liste) {
    return liste.sort((a, b) => a.dosya.localeCompare(b.dosya, "tr", { numeric: true, sensitivity: "base" }));
  }
  function listeyeCevir(adlar) {
    const goruldu = new Set();
    const cikti = [];
    adlar.forEach((ad) => {
      if (!/\.html?$/i.test(ad) || haric(ad) || goruldu.has(ad)) return;
      goruldu.add(ad);
      cikti.push({ dosya: ad, baslik: guzelAd(ad) });
    });
    return cikti;
  }
  function kayitOku() {
    try {
      const v = JSON.parse(localStorage.getItem(KAYIT));
      return Array.isArray(v) ? v : [];
    } catch (e) { return []; }
  }
  function kayitYaz(liste) {
    try { localStorage.setItem(KAYIT, JSON.stringify(liste)); } catch (e) {}
  }
  // Zaman aşımlı fetch: ağ takılırsa sayfa sonsuza dek beklemesin
  function zamanliFetch(url, opts, ms) {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), ms || 6000);
    return fetch(url, Object.assign({}, opts || {}, { signal: c.signal }))
      .then((r) => { clearTimeout(t); return r; }, (e) => { clearTimeout(t); throw e; });
  }

  /* ============ DOSYA BULMA KAYNAKLARI ============ */
  function githubBilgi() {
    if (GITHUB) {
      return { owner: GITHUB.owner, repo: GITHUB.repo, yol: (GITHUB.path || "").replace(/^\/|\/$/g, "") };
    }
    if (!location.hostname.endsWith(".github.io")) return null;
    const owner = location.hostname.split(".")[0];
    const seg = location.pathname.split("/").filter(Boolean).map(decodeURIComponent);
    if (seg.length && /\.html?$/i.test(seg[seg.length - 1])) seg.pop();
    if (seg.length === 0) return { owner: owner, repo: owner + ".github.io", yol: "" };
    return { owner: owner, repo: seg[0], yol: seg.slice(1).join("/") };
  }

  // Kaynak 1: GitHub API
  async function githubApiTara(b) {
    const url = "https://api.github.com/repos/" + b.owner + "/" + b.repo + "/contents/" +
      b.yol.split("/").filter(Boolean).map(encodeURIComponent).join("/");
    const res = await zamanliFetch(url, { headers: { Accept: "application/vnd.github+json" } }, 6000);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const veri = await res.json();
    return listeyeCevir(veri.filter((f) => f.type === "file").map((f) => f.name));
  }

  // Kaynak 2: jsDelivr dosya listesi (API sınırı yok)
  async function jsdelivrTara(b, dal) {
    const onek = "/" + (b.yol ? b.yol + "/" : "");
    const url = "https://data.jsdelivr.com/v1/packages/gh/" + b.owner + "/" + b.repo + "@" + dal + "?structure=flat";
    const res = await zamanliFetch(url, {}, 6000);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const veri = await res.json();
    const adlar = (veri.files || [])
      .map((f) => f.name)
      .filter((n) => n.indexOf(onek) === 0 && n.slice(onek.length).indexOf("/") === -1)
      .map((n) => n.slice(onek.length));
    return listeyeCevir(adlar);
  }

  // Kaynak 3: Sunucu klasör listesi (yerel sunucu / okul sunucusu)
  async function sunucuTara() {
    const base = new URL("./", location.href);
    const res = await zamanliFetch(base.href, { cache: "no-store" }, 4000);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const doc = new DOMParser().parseFromString(await res.text(), "text/html");
    const adlar = [];
    doc.querySelectorAll("a[href]").forEach((a) => {
      try {
        const u = new URL(a.getAttribute("href"), base);
        if (u.origin !== base.origin || u.pathname.indexOf(base.pathname) !== 0) return;
        const rest = u.pathname.slice(base.pathname.length);
        if (!rest || rest.indexOf("/") !== -1) return;
        adlar.push(decodeURIComponent(rest));
      } catch (e) {}
    });
    return listeyeCevir(adlar);
  }

  // Hepsi aynı anda çalışır; boş olmayan ilk sonuç kazanır
  function ilkBasarili(gorevler) {
    return new Promise((resolve) => {
      let bekleyen = gorevler.length;
      if (!bekleyen) return resolve([]);
      function bitti(ad, neden) {
        hatalar.push(ad + ": " + neden);
        bekleyen -= 1;
        if (bekleyen === 0) resolve([]);
      }
      gorevler.forEach((g) => {
        let p;
        try { p = g[1](); } catch (e) { p = Promise.reject(e); }
        p.then(
          (liste) => { if (liste && liste.length) resolve(liste); else bitti(g[0], "boş"); },
          (e) => bitti(g[0], (e && e.message) || String(e))
        );
      });
    });
  }

  // Her dosyanın <title> etiketinden başlığı çek
  async function basliklariOku(liste) {
    await Promise.all(liste.map(async (item) => {
      try {
        const r = await zamanliFetch(encodeURI(item.dosya), { cache: "no-store" }, 6000);
        if (!r.ok) { if (r.status === 404) item.yok = true; return; }   // dosya gerçekten yoksa menüden çıkar
        const d = new DOMParser().parseFromString(await r.text(), "text/html");
        const t = d.querySelector("title");
        if (t && t.textContent.trim()) item.baslik = t.textContent.trim();
      } catch (e) {}
    }));
  }

  /* ============ MENÜ ============ */
  function menuCiz() {
    const q = searchEl.value.trim().toLocaleLowerCase("tr");
    const gorunen = tumDosyalar.filter((d) =>
      !q || d.baslik.toLocaleLowerCase("tr").indexOf(q) !== -1 || d.dosya.toLocaleLowerCase("tr").indexOf(q) !== -1
    );

    menu.innerHTML = "";
    gorunen.forEach((item) => {
      const i = tumDosyalar.indexOf(item);
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = encodeURI(item.dosya);
      a.dataset.dosya = item.dosya;
      if (item.dosya === aktifDosya) a.classList.add("active");

      const dot = document.createElement("span");
      dot.className = "dot";
      dot.textContent = ICONS[i % ICONS.length];
      dot.style.background = COLORS[i % COLORS.length];

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = item.baslik;

      a.appendChild(dot);
      a.appendChild(label);
      a.addEventListener("click", (e) => { e.preventDefault(); dosyaAc(item); });
      li.appendChild(a);
      menu.appendChild(li);
    });

    const bosVeAraniyor = araniyor && tumDosyalar.length === 0;
    if (bosVeAraniyor) {
      countEl.textContent = "Dosyalar aranıyor...";
      emptyEl.classList.remove("show");
    } else {
      countEl.textContent = q ? gorunen.length + " / " + tumDosyalar.length + " dosya" : tumDosyalar.length + " dosya";
      if (tumDosyalar.length === 0) {
        emptyEl.innerHTML = "😕<br>Hiç dosya bulunamadı.<br><small>Sayfayı yenile ya da öğretmeninden yardım iste.</small>" +
          (hatalar.length ? "<br><small style=\"opacity:.7\">(" + hatalar.join(" · ") + ")</small>" : "");
      } else {
        emptyEl.innerHTML = "🔎<br>Aramana uyan ders yok.";
      }
      emptyEl.classList.toggle("show", gorunen.length === 0);
    }
    pickBtn.classList.toggle("show", !araniyor && tumDosyalar.length === 0);
  }

  function dosyaAc(item) {
    const url = encodeURI(item.dosya);
    aktifDosya = item.dosya;
    frame.src = url;
    frame.classList.add("show");
    welcome.classList.add("hide");
    currentTitle.textContent = item.baslik;
    openNew.href = url;
    openNew.classList.add("show");
    document.title = item.baslik + " · Derslerim";
    Array.prototype.forEach.call(menu.querySelectorAll("a"), (a) =>
      a.classList.toggle("active", a.dataset.dosya === item.dosya)
    );
    try { history.replaceState(null, "", "#" + encodeURIComponent(item.dosya)); } catch (e) {}
    menuKapat();
  }

  function menuAc()    { sidebar.classList.add("open");    overlay.classList.add("show"); }
  function menuKapat() { sidebar.classList.remove("open"); overlay.classList.remove("show"); }

  burger.addEventListener("click", () => (sidebar.classList.contains("open") ? menuKapat() : menuAc()));
  overlay.addEventListener("click", menuKapat);
  window.addEventListener("keydown", (e) => { if (e.key === "Escape") menuKapat(); });
  searchEl.addEventListener("input", menuCiz);

  /* ============ YEREL KULLANIM: KLASÖR SEÇME ============ */
  // Dosya çift tıklanarak açılırsa tarayıcı klasörü kendi okuyamaz; düğmeyle klasör seçilir.
  pickBtn.addEventListener("click", () => $("folderInput").click());
  $("folderInput").addEventListener("change", async (e) => {
    const files = Array.prototype.slice.call(e.target.files);
    e.target.value = "";
    const liste = [];
    for (const f of files) {
      const parcalar = (f.webkitRelativePath || f.name).split("/");
      if (parcalar.length > 2 || !/\.html?$/i.test(f.name) || haric(f.name)) continue;
      let baslik = guzelAd(f.name);
      try {
        const d = new DOMParser().parseFromString(await f.text(), "text/html");
        const t = d.querySelector("title");
        if (t && t.textContent.trim()) baslik = t.textContent.trim();
      } catch (err) {}
      liste.push({ dosya: f.name, baslik: baslik });
    }
    tumDosyalar = sirala(liste);
    kayitYaz(tumDosyalar);
    menuCiz();
  });

  /* ============ BAŞLAT ============ */
  async function baslat() {
    const elle = DOSYALAR.filter((d) => !haric(d.dosya)).map((d) => ({ dosya: d.dosya, baslik: d.baslik || guzelAd(d.dosya) }));

    // 1) Önce varsa önbellekteki listeyi hemen göster
    tumDosyalar = sirala(elle.length ? elle : kayitOku());
    menuCiz();

    // 2) Elle liste yoksa: tüm kaynaklar aynı anda aransın
    if (!elle.length) {
      const gorevler = [];
      const b = githubBilgi();
      if (b) {
        gorevler.push(["GitHub", () => githubApiTara(b)]);
        gorevler.push(["jsDelivr", () => jsdelivrTara(b, "main")]);
        gorevler.push(["jsDelivr2", () => jsdelivrTara(b, "master")]);
      }
      gorevler.push(["Sunucu", sunucuTara]);

      const bulunan = await ilkBasarili(gorevler);
      if (bulunan.length) tumDosyalar = sirala(bulunan);
    }

    araniyor = false;
    menuCiz();

    // 3) Başlıkları dosyaların içinden oku
    await basliklariOku(tumDosyalar);
    tumDosyalar = tumDosyalar.filter((d) => !d.yok);
    sirala(tumDosyalar);
    if (tumDosyalar.length) kayitYaz(tumDosyalar);
    menuCiz();

    // 4) Adreste #dosya.html varsa doğrudan aç
    let hash = "";
    try { hash = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
    const hedef = tumDosyalar.find((d) => d.dosya === hash);
    if (hedef) dosyaAc(hedef);
  }

  baslat().catch((e) => {
    araniyor = false;
    hatalar.push((e && e.message) || String(e));
    menuCiz();
  });
})();
</script>
</body>
</html>
